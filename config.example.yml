# ==================== bilibili-intro-generator 统一配置（示例模板）====================
# 使用方式：复制本文件为 config.yml，然后填写你自己的配置。
# 注意：config.yml 不应提交到公开仓库（已在 .gitignore 中忽略）。
# 三个分区均可只写需要覆盖的项，其余自动使用内置默认值。

# ===== LLM 弹幕分类（可选）=====
# 不填 api_key 时跳过 AI 分类，简介图仍正常生成（弹幕使用关键词规则着色）。
llm:
  provider: deepseek
  # 方式一：直接填明文（请把本文件复制为 config.yml 后再填，config.yml 已被 gitignore）
  api_key: ""  # 留空则跳过 AI 弹幕分类（简介图仍正常生成）
  # 方式二：从环境变量读取（优先级高于 api_key），变量名可自定义
  api_key_env: "BILI_INTRO_API_KEY"
  base_url: "https://api.deepseek.com"
  model: "deepseek-chat"

# ===== 弹幕过滤 =====
# exact_match: 完全等于这些内容的弹幕不显示
# contain:     包含这些子串的弹幕不显示
danmaku_filter:
  exact_match: ["", "。", "."]
  contain: []

# ===== 下载难度检测 =====
# 下载前评估视频时长/分P数，超过阈值自动驳回，避免下载超大视频。
detector:
  # 单P最大时长（秒）
  max_single_video_duration: 2000
  # 总时长上限（秒）
  max_total_duration: 2400
  # 最大分P数
  max_part_count: 5
  # 难度权重（两项之和应为 1.0）
  difficulty_weights:
    duration_weight: 0.8
    part_count_weight: 0.2
  # 综合难度阈值（0-10），超过则驳回
  difficulty_threshold: 7.0
  # 缓存有效期（秒）
  cache_ttl: 86400
  # 最小请求间隔（秒），防止请求过快被封
  min_request_interval: 2.0
  # API 请求超时（秒）
  timeout: 15
  # 最大尝试次数（至少 1；1 表示只尝试一次、不重试）
  max_retries: 1

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bilibili-intro-generator"
version = "0.2.1"
description = "B站简介图生成器（附视频下载工具）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "bilibili-api-python>=16.0.0",
    "aiohttp>=3.8.0",
    "aiofiles>=22.0.0",
    "PyYAML>=6.0",
    "playwright>=1.30.0",
]

[project.scripts]
bili-intro-generator = "bilibili_tool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
